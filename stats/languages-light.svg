  <text x="368" y="112" class="v" text-anchor="end">3.1%</text>
  <circle cx="29" cy="132" r="5" fill="#89e051"/>
  <text x="42" y="136" class="l">Shell</text>
  <text x="184" y="136" class="v" text-anchor="end">1.1%</text>
  <circle cx="213" cy="132" r="5" fill="#f1e05a"/>
