name: Refresh profile stats

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Cron on GitHub is best-effort and can be
    # delayed under load, which is fine for something this cosmetic.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/stats.yml'

# Least privilege: the job only needs to push the regenerated SVGs.
permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stat cards
        env:
          # The default token is enough: the script reads public data only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py --user ${{ github.repository_owner }}

      - name: Commit if the numbers moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats/
          if git diff --staged --quiet; then
            echo "No change in stats - nothing to commit."
          else
            git commit -m 'chore: refresh profile stats [skip ci]'
            git push
          fi
